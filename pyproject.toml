[project]
name = "kumo-automation"
version = "0.1.0"
description = "KumoMTA server provisioning & deployment tool (Phase 1 MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "paramiko>=3.4",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "dnspython>=2.6",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "loguru>=0.7",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
kumo-automation = "kumo_automation.app:main"
kumo-cli = "kumo_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kumo_automation"]

# Ship the Jinja2 templates with the package
[tool.hatch.build.targets.wheel.force-include]
"src/kumo_automation/core/templates" = "kumo_automation/core/templates"
